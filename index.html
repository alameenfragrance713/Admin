<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — Al Ameen Fragrance</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230b0b0c'/><text x='50' y='65' text-anchor='middle' fill='%23d4af37' font-family='Georgia' font-size='42' font-weight='bold'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-body">

<form class="admin-login-card" id="login-form">
  <div style="width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,#d4af37,#b8923a);color:#000;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:2rem;">A</div>
  <h1>AL AMEEN</h1>
  <p class="sub">Admin Panel — Sign In</p>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" class="form-control" autocomplete="username" required>
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" class="form-control" autocomplete="current-password" required>
  </div>

  <button type="submit" class="btn btn-gold btn-block" id="login-btn">Sign In</button>
  <p id="login-msg" style="margin-top:14px;font-size:.85rem;text-align:center;color:var(--a-red);min-height:20px;"></p>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  function waitForSb(retries = 20) {
    if (window.sb) {
      AdminAuth.redirectIfAuthed();
      return;
    }
    if (retries <= 0) {
      const msg = document.getElementById('login-msg');
      if (msg) msg.textContent = 'Supabase not loaded. Check js/config.js';
      return;
    }
    setTimeout(() => waitForSb(retries - 1), 200);
  }
  waitForSb();
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('login-msg');
  const btn = document.getElementById('login-btn');

  msg.style.color = 'var(--a-muted)';
  msg.textContent = 'Signing in…';
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    if (!window.sb) throw new Error('Supabase client not loaded. Check js/config.js');
    await AdminAuth.login(email, password);
    msg.style.color = 'var(--a-green)';
    msg.textContent = 'Success! Redirecting...';
    window.location.href = 'dashboard.html';
  } catch (err) {
    console.error('[Login]', err);
    msg.style.color = 'var(--a-red)';
    msg.textContent = err.message || 'Login failed.';
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
